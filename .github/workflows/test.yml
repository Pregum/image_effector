name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 依存パッケージは無いので install は不要
      - run: node scripts/test-project-format.mjs
      - run: node scripts/test-mcp-server.mjs
      # ランナーに入っている Chrome で実際に描画させる
      - run: node scripts/test-web-app.mjs
        env:
          CHROME_BIN: /usr/bin/google-chrome
